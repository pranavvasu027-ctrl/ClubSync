<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ClubSync</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: persistent left sidebar + sticky top bar + content with optional right rail; sidebar becomes a drawer under 900px, rails stack, grids collapse to one column. */
:root{
  --bg:#f3f7fd; --surface:#ffffff; --ink:#0a1431; --muted:#5d6a86; --line:#e3e9f4;
  --blue:#0b63f6; --blue-soft:#e8f0fe; --navy:#0a1f4d; --soft:#f6f9fe;
  --green:#12a37a; --green-soft:#dcf5ec; --amber:#f59e0b; --amber-soft:#fff2d9; --red:#e5484d; --red-soft:#ffe9ea; --purple:#7c3aed;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --shadow:0 1px 2px rgba(10,20,49,.04),0 4px 14px rgba(10,20,49,.05);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:auto}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:var(--ink)}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{text-wrap:balance}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:14px;height:14px}.ic.lg{width:24px;height:24px}
.row{display:flex;align-items:center;gap:8px}
.muted{color:var(--muted)}
.tiny{font-size:12px}

/* shell */
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:6px;z-index:40}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:18px;padding:2px 8px 18px;letter-spacing:-.01em}
.logo svg{width:28px;height:28px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:#2a3553;font-weight:500}
.nav a:hover{background:var(--soft)}
.nav a.on{background:var(--blue-soft);color:var(--blue);font-weight:600}
.side .bottom{margin-top:auto}
.scrim{display:none}
.main{min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);display:flex;align-items:center;gap:14px;padding:14px max(24px,env(safe-area-inset-right,0px)) 14px 24px}
.hamb{display:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;width:40px;height:40px;align-items:center;justify-content:center}
.search{flex:1;max-width:560px;display:flex;align-items:center;gap:9px;background:#e9f0fb;border-radius:10px;padding:0 12px;height:40px;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:0;height:100%}
.search input::placeholder{color:#7a86a3}
.top .sp{flex:1}
.bell{position:relative;background:none;border:0;padding:6px;border-radius:50%;display:flex}
.bell i{position:absolute;top:4px;right:5px;width:8px;height:8px;background:var(--red);border-radius:50%;border:2px solid var(--bg)}
.me{display:flex;align-items:center;gap:8px;background:none;border:0;padding:2px;border-radius:999px;font-weight:600}
.av{width:32px;height:32px;border-radius:50%;background:#cfe0ff;color:var(--blue);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.me small{display:block;font-weight:400;color:var(--muted);font-size:11px;line-height:1.1;text-align:left}
.menu{position:relative}
.drop{position:absolute;right:0;top:calc(100% + 8px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-width:200px;padding:6px;z-index:50}
.drop a{display:block;padding:9px 12px;border-radius:8px;font-weight:500}
.drop a:hover{background:var(--soft)}
.content{padding:6px max(24px,env(safe-area-inset-right,0px)) 40px 24px}
.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:6px 0 16px}
.pagehead h1{font-size:26px;font-weight:700;letter-spacing:-.02em}
.pagehead p{color:var(--muted);margin-top:3px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.cols.wide{grid-template-columns:minmax(0,1fr) 320px}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}

/* primitives */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--blue);color:#fff;border:1px solid var(--blue);border-radius:9px;padding:9px 16px;font-weight:600;white-space:nowrap}
.btn:hover{background:#0a56d8}
.btn.sm{padding:7px 12px;font-size:12.5px}
.btn.out{background:var(--surface);color:var(--blue);border-color:#bcd2fb}
.btn.out:hover{background:var(--blue-soft)}
.btn.soft{background:var(--blue-soft);color:var(--blue);border-color:transparent}
.btn.ok{background:var(--green);border-color:var(--green)}
.btn.danger{background:var(--surface);color:var(--red);border-color:#f3b8ba}
.btn.block{display:flex;width:100%}
.link{color:var(--blue);font-weight:600;font-size:12.5px;display:inline-flex;align-items:center;gap:4px;background:none;border:0;padding:0}
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.sec h2{font-size:16px;font-weight:700}
.chip{display:inline-flex;align-items:center;background:var(--blue-soft);color:var(--blue);padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:500;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600}
.pill.g{background:var(--green-soft);color:#0a7d5c}.pill.a{background:var(--amber-soft);color:#b36b00}.pill.n{background:#edf0f6;color:#44506b}
.dotc{width:6px;height:6px;border-radius:50%;background:currentColor}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 0;color:#41506f;font-weight:500;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tabs button.on{color:var(--blue);border-color:var(--blue);font-weight:600}
.count{background:#e4ecfa;color:#41506f;border-radius:999px;font-size:11px;padding:1px 7px;font-weight:600}
.tabs button.on .count{background:var(--blue);color:#fff}
.sel{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:0 10px;height:38px;color:#33405d;min-width:0}
.sel select{border:0;background:transparent;outline:0;appearance:none;-webkit-appearance:none;padding-right:4px;min-width:0;max-width:100%;cursor:pointer}
.filters{display:flex;flex-wrap:wrap;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;box-shadow:var(--shadow);margin-bottom:14px}
.filters .sel.grow{flex:1;min-width:180px}
.filters .sel input{flex:1;border:0;outline:0;background:transparent;min-width:0}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* banners (stand-ins for photography) */
.ban{position:relative;background-size:cover;background-position:center;overflow:hidden}
.b-tech{background:radial-gradient(circle at 70% 25%,rgba(80,150,255,.55),transparent 38%),radial-gradient(circle at 20% 80%,rgba(0,40,120,.8),transparent 50%),linear-gradient(135deg,#071538,#0f3a8f 55%,#050c26)}
.b-work{background:radial-gradient(circle at 30% 30%,rgba(255,200,140,.35),transparent 40%),linear-gradient(135deg,#1c222e,#3d4658 60%,#6b5a4b)}
.b-hack{background:radial-gradient(circle at 60% 20%,rgba(190,120,255,.6),transparent 40%),radial-gradient(circle at 10% 90%,rgba(255,60,160,.35),transparent 45%),linear-gradient(135deg,#1b0a3d,#4b1fa8 60%,#140730)}
.b-social{background:radial-gradient(circle at 50% 100%,rgba(30,90,30,.8),transparent 55%),linear-gradient(135deg,#3b2a1a,#5b7a2f 70%,#2d4a1e)}
.b-lead{background:radial-gradient(circle at 75% 20%,rgba(255,160,80,.45),transparent 38%),linear-gradient(135deg,#2a1710,#5a3524 55%,#14131f)}
.b-cult{background:radial-gradient(circle at 50% 30%,rgba(255,120,80,.6),transparent 40%),linear-gradient(135deg,#3b0d2a,#a3204f 60%,#e0653a)}
.b-photo{background:radial-gradient(circle at 70% 40%,rgba(255,90,170,.65),transparent 38%),linear-gradient(135deg,#0d0830,#4a1d7a 60%,#d6336c)}
.b-ent{background:radial-gradient(circle at 65% 30%,rgba(120,190,255,.4),transparent 40%),linear-gradient(135deg,#0b1226,#1d3c6b 65%,#2f6aa8)}
.b-robot{background:radial-gradient(circle at 30% 60%,rgba(90,140,255,.5),transparent 40%),linear-gradient(135deg,#0a1630,#1f4fc0 60%,#0a1020)}
.b-design{background:radial-gradient(circle at 25% 30%,#ffd24a,transparent 35%),radial-gradient(circle at 75% 60%,#ff5fa2,transparent 40%),linear-gradient(135deg,#f59e0b,#6366f1)}
.b-music{background:radial-gradient(circle at 70% 30%,rgba(240,100,255,.5),transparent 40%),linear-gradient(135deg,#1e1b4b,#7a1f95 70%,#150b2e)}
.b-drama{background:radial-gradient(circle at 40% 40%,rgba(255,140,80,.4),transparent 40%),linear-gradient(135deg,#4a0d0d,#7a1d1d 50%,#12141f)}
.b-env{background:radial-gradient(circle at 50% 70%,rgba(190,230,120,.5),transparent 45%),linear-gradient(135deg,#0f3d1e,#2f7a2f 60%,#69a52a)}
.b-fin{background:linear-gradient(135deg,#0b1224,#0e4f66 65%,#0a2a3a)}
.b-fin::after,.b-code::after,.b-tech::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 1px,transparent 1px 22px),repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 22px)}
.b-code{background:radial-gradient(circle at 55% 45%,rgba(60,140,255,.55),transparent 42%),linear-gradient(135deg,#050c1f,#0c2a5c 60%,#040913)}
.tag{position:absolute;top:10px;left:10px;color:#fff;font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;z-index:1}
.bm{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.18);backdrop-filter:blur(4px);border:0;color:#fff;display:grid;place-items:center;z-index:1}
.bm.on{background:#fff;color:var(--blue)}

/* event cards */
.ev .ban{height:96px;border-radius:12px 12px 0 0}
.ev{padding:0;overflow:hidden;display:flex;flex-direction:column;cursor:pointer}
.ev .bd{display:grid;grid-template-columns:42px minmax(0,1fr);gap:12px;padding:12px 14px 6px}
.date{text-align:center;line-height:1.05}
.date b{display:block;font-size:20px;font-weight:700}
.date span{font-size:10.5px;font-weight:700;color:var(--red);display:block}
.date em{font-style:normal;font-size:11px;color:var(--muted)}
.ev h3{font-size:14px;font-weight:700;margin-bottom:5px}
.meta{display:flex;align-items:center;gap:6px;font-size:12px;color:#44506b;margin-top:3px;min-width:0}
.meta span{min-width:0;overflow-wrap:anywhere}
.cdot{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:#fff;flex:none}
.cdot svg{width:10px;height:10px}
.ev .ft{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 14px 14px;margin-top:auto;font-size:12px;color:var(--muted)}

/* stats */
.stat{display:flex;align-items:center;gap:12px;cursor:pointer;padding:14px}
.stat .bub{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.stat small{display:block;font-size:12px;color:#44506b}
.stat b{font-size:22px;font-weight:700}
.stat .go{margin-left:auto;color:#8592ad}

/* clubs */
.club{padding:0;overflow:hidden;display:flex;flex-direction:column}
.club .ban{height:78px}
.club .lg{position:absolute;left:14px;bottom:-18px;width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;border:2px solid #fff;z-index:2}
.club .bd{padding:24px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.club .bd h3{font-size:14px;font-weight:700;display:flex;justify-content:space-between;gap:8px;align-items:center}
.club .bd p{font-size:12px;color:#44506b}
.club .chips{margin:4px 0 8px}
.club .btn{margin-top:auto}
.mini{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:var(--shadow);cursor:pointer}
.ico{width:42px;height:42px;border-radius:12px;background:var(--navy);color:#fff;display:grid;place-items:center;flex:none}

.promo{border-radius:14px;padding:18px;min-height:150px;position:relative;overflow:hidden;background:linear-gradient(135deg,#dcebff,#eef5ff);border:1px solid var(--line)}
.promo h3{font-size:16px;line-height:1.25;max-width:58%}
.promo .ppl{position:absolute;right:10px;bottom:0;display:flex;align-items:flex-end;gap:2px}
.promo .ppl i{display:block;border-radius:30px 30px 4px 4px}
.dl{display:flex;flex-direction:column}
.dl a{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.dl a:last-child{border:0}
.dl .ico2{width:30px;height:30px;border-radius:8px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;flex:none}
.dl b{font-weight:600;font-size:12.5px;display:block}

/* detail pages */
.hero{height:210px;border-radius:14px;display:flex;align-items:flex-end;padding:22px;color:#fff}
.hero h1{font-size:clamp(24px,4vw,38px);font-weight:800;letter-spacing:-.02em;line-height:1.08;position:relative;z-index:2}
.hero .by{display:flex;align-items:center;gap:8px;margin-top:10px;font-weight:500;position:relative;z-index:2}
.hero .acts{position:absolute;top:12px;right:12px;display:flex;gap:8px;z-index:2}
.info{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.info div{display:flex;gap:10px;align-items:center;min-width:0}
.info .ib{width:34px;height:34px;border-radius:10px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;flex:none}
.info b{display:block;font-weight:600;font-size:12.5px}.info small{color:var(--muted);font-size:11.5px}
.faces{display:flex}.faces i{width:22px;height:22px;border-radius:50%;border:2px solid #fff;margin-left:-6px;background:linear-gradient(135deg,#7aa7ff,#3b5bdb)}
.faces i:first-child{margin-left:0}.faces i:nth-child(2){background:linear-gradient(135deg,#ffb88a,#e8590c)}.faces i:nth-child(3){background:linear-gradient(135deg,#8ce99a,#2b8a3e)}
.sect h2{font-size:15px;font-weight:700;margin-bottom:8px}
.sect p{color:#33405d;max-width:75ch}
.sect{padding:14px 0 2px;scroll-margin-top:110px}
.ticks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.ticks li{display:flex;gap:9px;align-items:flex-start;color:#33405d}
.ticks .ck{width:16px;height:16px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;margin-top:2px;flex:none}
.ticks .ck svg{width:10px;height:10px;stroke-width:3}
.reqs{display:flex;gap:20px;flex-wrap:wrap;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px}
.reqs span{display:flex;gap:8px;align-items:center;font-size:12.5px;color:#33405d}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:0 0 14px 18px;position:relative;font-size:12.5px}
.tl li::before{content:"";position:absolute;left:0;top:5px;width:9px;height:9px;border-radius:50%;background:var(--blue)}
.tl li::after{content:"";position:absolute;left:4px;top:15px;bottom:-4px;width:1px;background:#bcd2fb}
.tl li:last-child::after{display:none}
.tl b{font-weight:600;display:block}
.person{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface)}
.pic{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#ffd7b0,#c97a3f);display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.soc{display:flex;gap:8px;margin-left:auto}
.soc i{font-style:normal;width:26px;height:26px;border-radius:7px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-size:10px;font-weight:700}
.tile{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tile small{display:block;color:var(--muted);font-size:11.5px}
.tile .ib{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none}
.kv{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;font-size:12.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:500;min-width:0;overflow-wrap:anywhere}
.related{display:flex;gap:10px;align-items:center;padding:8px 0;cursor:pointer}
.related .ban{width:46px;height:46px;border-radius:9px;flex:none}
.related b{display:block;font-size:12.5px}

/* club detail */
.chead{display:flex;gap:16px;align-items:flex-end;margin-top:-44px;padding:0 18px;position:relative;z-index:2;flex-wrap:wrap}
.chead .big{width:84px;height:84px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;border:4px solid #fff;flex:none;box-shadow:var(--shadow)}
.chead .big svg{width:38px;height:38px}
.cinfo{margin-left:auto;display:grid;grid-template-columns:repeat(2,auto);gap:10px 26px;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;font-size:12px;align-self:flex-end}
.cinfo div{display:flex;gap:9px;align-items:center}.cinfo small{display:block;color:var(--muted)}
.person.sm{padding:6px 0;border:0;background:none;gap:10px}
.person.sm .pic{width:38px;height:38px;font-size:12px}
.socials{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center;font-size:10.5px;color:var(--muted)}
.socials span{display:flex;flex-direction:column;align-items:center;gap:4px}
.socials i{font-style:normal;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--blue);background:var(--blue-soft);font-weight:700;font-size:11px}

/* notifications */
.nlist{padding:0;overflow:hidden}
.ngroup{padding:12px 16px 6px;font-weight:700;font-size:13px}
.nitem{display:flex;gap:12px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
.nitem .dot{width:7px;height:7px;border-radius:50%;background:var(--blue);flex:none}
.nitem .dot.off{background:transparent}
.nitem .ico{width:36px;height:36px;border-radius:50%}
.nitem .ico.lt{background:var(--blue-soft);color:var(--blue)}
.nitem .tx{flex:1;min-width:0}.nitem b{font-weight:600}
.nitem .th{width:76px;height:42px;border-radius:7px;flex:none}
.kebab{background:none;border:0;color:var(--muted);padding:4px;display:flex}
.fl{display:flex;flex-direction:column}
.fl label{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;color:#33405d}
.fl label.on{background:var(--blue-soft);color:var(--blue);font-weight:600}
.fl label span{flex:1}
.fl input{accent-color:var(--blue);width:15px;height:15px}

/* profile + settings */
.pcard{display:flex;gap:18px;align-items:center;flex-wrap:wrap}

 <div class="row" style="flex-wrap:wrap;gap:10px;justify-content:space-between;border-bottom:1px solid var(--line);margin-bottom:14px" data-fgroup="fgrid"><div class="tabs" style="border:0"><button class="on">All Clubs (5)</button><button>Active (4)</button><button>Pending (1)</button><button>Archived (0)</button></div><div class="row" style="flex-wrap:wrap;padding-bottom:6px"><label class="sel">${ic('search','sm')}<input type="search" data-fq placeholder="Search supervised clubs..." style="border:0;outline:0;background:transparent;width:170px;min-width:0" aria-label="Search supervised clubs"></label><label class="sel"><select aria-label="Category"><option>Category</option><option>Technical</option><option>Cultural</option><option>Sports</option></select></label><label class="sel"><select aria-label="Status"><option>Status</option><option>Open</option><option>Review</option></select></label></div></div>
 <div class="stack" style="gap:12px" id="fgrid">${rows.map(r=>`<article class="card frow" data-s="${(r[0]+' '+r[2]+' '+r[1]).toLowerCase()}"><span class="ib" style="background:${r[12]};color:${r[13]}">${ic(r[11],'lg')}</span><div style="min-width:0"><h3>${r[0]} <span class="pill" style="background:${r[1]==='Technical'?'#e7efff':r[1]==='Cultural'?'#ffe4ef':'#dcf5ec'};color:${r[1]==='Technical'?'#0b63f6':r[1]==='Cultural'?'#e11d48':'#12a37a'}">${r[1]}</span></h3><div class="tiny muted row" style="gap:5px;margin:3px 0">${ic('user','sm')} President: ${r[2]}</div><p class="tiny muted">${r[3]}</p></div><div class="nums"><div>${ic('users','sm')}<b>${r[4]}</b>Members</div><div>${ic('calendar','sm')}<b>${r[5]}</b>Upcoming Events</div></div><div class="nxt"><p><span>Next Event</span><span><b>${r[6]}</b><br><span class="muted">${r[7]}</span></span></p><p><span>Recruitment</span><span><span class="pill ${r[10]}"><i class="dotc"></i>${r[8]}</span><br><span class="muted">${r[9]}</span></span></p></div><button class="btn sm" data-act="manage">Manage Club ${ic('arrow','sm')}</button><button class="kebab" aria-label="More">${ic('more')}</button></article>`).join('')}</div>`;
}
function pAuth(mode){
 const su=mode==='signup', G='<svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.6a4.8 4.8 0 0 1-2.1 3.1v2.6h3.4c2-1.8 3.1-4.5 3.1-7.5z"/><path fill="#34A853" d="M12 22c2.8 0 5.2-.9 6.9-2.5l-3.4-2.6c-.9.6-2.1 1-3.5 1-2.7 0-5-1.8-5.800-4.300H2.700v2.700A10 10 0 0 0 12 22z"/><path fill="#FBBC05" d="M6.200 13.600a6 6 0 0 1 0-3.800V7.100H2.700a10 10 0 0 0 0 9.200z"/><path fill="#EA4335" d="M12 6c1.500 0 2.900.5 4 1.600l3-3A10 10 0 0 0 2.700 7.100l3.500 2.700C7 7.800 9.300 6 12 6z"/></svg>';
 const f=(id,lab,icn,ph,type='text',eye)=>`<label class="field">${lab}<span class="inp">${ic(icn,'sm')}<input id="${id}" type="${type}" placeholder="${ph}" ${type==='password'?'autocomplete="'+(su?'new':'current')+'-password"':''}>${eye?`<button type="button" data-eye="${id}" aria-label="Show password">${ic('eye','sm')}</button>`:''}</span></label>`;
 return `<div class="auth"><div class="l"><a class="logo" href="#home">${logoSvg}ClubSync</a>${su?`<h1>Join the ClubSync Community</h1><p class="sub">Create your account and start exploring everything your campus offers.</p><div class="stack" style="gap:14px;margin-top:22px;max-width:300px">${[['users','Explore Clubs','Find and join clubs that match your interests.','#dbe8ff','#0b63f6'],['calendar','Stay Updated','Get notified about events, recruitments, and activities.','#d9f4e8','#12a37a'],['trophy','Build Your Profile','Showcase your skills, participation, and achievements.','#e7defd','#7c3aed']].map(x=>`<div class="row" style="gap:12px;align-items:flex-start"><span class="ico" style="background:${x[3]};color:${x[4]};border-radius:12px">${ic(x[0])}</span><div><b>${x[1]}</b><div class="tiny muted">${x[2]}</div></div></div>`).join('')}</div>`:`<h1>All Your Campus Opportunities in One Place</h1><p class="sub">Discover events, join clubs, participate in recruitments, and build your campus journey with ClubSync.</p>`}
 <div class="scene" aria-hidden="true"><div class="bld"></div><div class="win"></div><div class="gr"></div><span class="tree" style="left:50%"></span><span class="tree" style="left:62%;height:90px;width:56px"></span><div class="st"><i style="background:#334155"></i><i style="background:#c2410c;height:78px"></i><i style="background:#0f766e;height:82px"></i></div></div></div>
 <div class="r"><form class="acard" id="${su?'suform':'liform'}"><h2>${su?'Create Your Account':'Welcome Back'}</h2><p class="muted">${su?'Join ClubSync and be a part of a more connected campus experience.':'Sign in to your ClubSync account.'}</p>
 <button type="button" class="gbtn" data-act="google">${G} Continue with Google</button><div class="or">or</div>
 ${su?f('fn','Full Name','user','Enter your full name'):''}${f('em','College Email','mail','yourname@college.edu','email')}${su?'<small class="muted tiny" style="margin-top:-8px">Use your college email for verification.</small>':''}${f('pw','Password','lock',su?'Create a password':'Enter your password','password',1)}${su?f('pw2','Confirm Password','lock','Confirm your password','password',1):''}
 ${su?`<label class="chk"><input type="checkbox" id="terms"> <span>I agree to the <a class="link" href="#signup">Terms of Service</a> and <a class="link" href="#signup">Privacy Policy</a>.</span></label>`:`<div class="row" style="justify-content:space-between;flex-wrap:wrap"><label class="chk"><input type="checkbox" checked> Keep me signed in</label><a class="link" href="#login" data-act="forgot">Forgot password?</a></div>`}
 <button class="btn" style="height:44px" type="submit">${su?'Create Account':'Sign In'}</button>
 <p class="muted" style="text-align:center;font-size:12.5px">${su?'Already have an account? <a class="link" href="#login">Sign in</a>':'Don\'t have an account? <a class="link" href="#signup">Sign up</a>'}</p>${su?'':'<p style="text-align:center;font-size:12px"><a class="link" href="#faculty" data-role="faculty">Sign in as faculty supervisor</a></p>'}</form></div></div>`;
}

/* ---------- router ---------- */
const R={
 login:()=>pAuth('login'),signup:()=>pAuth('signup'),
 home:()=>shell('home',pHome()),events:()=>shell('events',pEvents()),hackathons:()=>shell('hackathons',pEvents(1)),event:()=>shell('events',pEvent()),
 clubs:()=>shell('clubs',pClubs()),club:()=>shell('clubs',pClub()),recruitments:()=>shell('recruitments',pRecs()),recruitment:()=>shell('recruitments',pRec()),
 notifications:()=>shell('notifications',pNotes()),profile:()=>shell('profile',pProfile()),preferences:()=>shell('prefs',pPrefs()),
 faculty:()=>{S.role='faculty';return shell('sup',pFaculty())}};
function render(keepScroll){
 const name=(location.hash||'#home').slice(1);const key=R[name]?name:'home';
 if(!['faculty','login','signup'].includes(key)&&key!=='preferences'&&S.role==='faculty'&&false)S.role='student';
 const y=scrollY;$('#app').innerHTML=R[key]();document.title='ClubSync';
 document.body.classList.remove('nav-open');
 if(keepScroll)scrollTo(0,y);
 bind();
}
function go(h){if(location.hash==='#'+h)render(true);else location.hash=h}
addEventListener('hashchange',()=>{render();scrollTo(0,0)});

/* ---------- interactions ---------- */
function filt(g){
 const root=$('#'+g.dataset.fgroup);if(!root)return;
 const q=($('[data-fq]',g)||{value:''}).value.trim().toLowerCase(),ty=($('[data-ftype]',g)||{value:''}).value,cl=($('[data-fclub]',g)||{value:''}).value,ct=($('[data-fcat]',g)||{selectedIndex:0});
 const cat=ct.selectedIndex>0?ct.value:(S.clubCat!=='All'?S.clubCat:'');
 let n=0;[...root.children].forEach(c=>{const ok=(!q||(c.dataset.s||'').includes(q))&&(!ty||c.dataset.type===ty)&&(!cl||c.dataset.club===cl)&&(!cat||!c.dataset.ccat||c.dataset.ccat===cat);c.hidden=!ok;if(ok)n++});
 const em=$('#evempty');if(em){em.hidden=n>0;em.textContent='No events match your filters.'}
}
function bind(){
 $$('[data-fgroup]').forEach(g=>{g.addEventListener('input',()=>filt(g));g.addEventListener('change',()=>filt(g));filt(g)});
 const pw=$('#pw1');if(pw)pw.addEventListener('input',()=>{const v=pw.value;const m={len:v.length>=8,up:/[A-Z]/.test(v),lo:/[a-z]/.test(v),nu:/[\d\W]/.test(v)&&v.length>0};$$('#rules li').forEach(l=>l.classList.toggle('ok',!!m[l.dataset.r]))});
 const pf=$('#pwform');if(pf)pf.addEventListener('submit',e=>{e.preventDefault();const a=$('#pw1').value,b=$('#pw2').value;if(a.length<8||!/[A-Z]/.test(a)||!/[a-z]/.test(a)||!/[\d\W]/.test(a))return toast('New password does not meet the rules yet.');if(a!==b)return toast('Passwords do not match.');toast('Password updated');pf.reset();$$('#rules li').forEach(l=>l.classList.remove('ok'))});
 const li=$('#liform');if(li)li.addEventListener('submit',e=>{e.preventDefault();S.role='student';go('home')});
 const su=$('#suform');if(su)su.addEventListener('submit',e=>{e.preventDefault();if(!$('#fn').value.trim()||!$('#em').value.trim())return toast('Enter your name and college email.');if($('#pw').value!==$('#pw2').value)return toast('Passwords do not match.');if(!$('#terms').checked)return toast('Please accept the Terms of Service.');S.role='student';go('home')});
}
document.addEventListener('click',e=>{
 const t=e.target.closest.bind(e.target);
 const rl=t('[data-role]');if(rl){S.role=rl.dataset.role;S.menu=false}
 const sv=t('[data-save]');if(sv){e.preventDefault();e.stopPropagation();const k=sv.dataset.save;S.saved[k]?delete S.saved[k]:S.saved[k]=1;toast(S.saved[k]?'Event saved':'Removed from saved');return render(true)}
 const fo=t('[data-follow]');if(fo){const k=fo.dataset.follow;S.follow[k]=!S.follow[k];toast(S.follow[k]?'Following club':'Unfollowed');return render(true)}
 const jn=t('[data-join]');if(jn){const k=jn.dataset.join;S.joined[k]=!S.joined[k];toast(S.joined[k]?'You joined the club':'You left the club');return render(true)}
 const ap=t('[data-apply]');if(ap){e.stopPropagation();const k=ap.dataset.apply;S.applied[k]=!S.applied[k];toast(S.applied[k]?'Application submitted':'Application withdrawn');return render(true)}
 const ey=t('[data-eye]');if(ey){const i=$('#'+ey.dataset.eye);i.type=i.type==='password'?'text':'password';return}
 const sc=t('[data-scroll]');if(sc){const el=document.getElementById(sc.dataset.scroll);const tabs=sc.closest('.tabs');if(tabs)$$('button',tabs).forEach(b=>b.classList.toggle('on',b===sc));if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return}
 const ts=t('[data-tabsel]');if(ts){$$('[data-tabsel]').forEach(b=>b.classList.toggle('on',b===ts));return}
 const et=t('[data-evtab]');if(et){S.evTab=et.dataset.evtab;return render(true)}
 const rt=t('[data-rtab]');if(rt){S.recTab=rt.dataset.rtab;return render(true)}
 const nt=t('[data-ntab]');if(nt){S.nTab=nt.dataset.ntab;return render(true)}
 const ct2=t('[data-clubtab]');if(ct2){S.clubTab=ct2.dataset.clubtab;return render(true)}
 const ca=t('[data-cat]');if(ca){S.clubCat=ca.dataset.cat;render(true);return}
 const nf=t('[data-nf]');if(nf&&e.target.matches('input')){const v=nf.dataset.nf;if(v==='')S.nSel=[];else{S.nSel=nf.checked?[...S.nSel,v]:S.nSel.filter(x=>x!==v)}return render(true)}
 const a=t('[data-act]');if(a){const k=a.dataset.act;
  if(k==='nav'){document.body.classList.toggle('nav-open');return}
  if(k==='menu'){S.menu=!S.menu;return render(true)}
  if(k==='reg'){S.reg=!S.reg;toast(S.reg?'You are registered':'Registration cancelled');return render(true)}
  if(k==='markread'){S.read=true;toast('All notifications marked as read');return render(true)}
  if(k==='clearf'){S.nSel=[];S.nTab='all';return render(true)}
  const msgs={share:'Event link copied',cal:'Added to Google Calendar',newclub:'Club creation opens soon',mute:'Notifications muted for 1 hour',edit:'Profile editing opens soon',dl:'Your data export has been requested',del:'Open Account settings to confirm deletion by email',google:'Google sign-in is not available in this preview',forgot:'Password reset link sent to your college email',saverec:'Recruitment saved',assign:'Select a club to assign',manage:'Club management opens soon',sect:'This section opens soon'};
  if(msgs[k]){if(k==='share'){try{navigator.clipboard.writeText(location.href).catch(()=>{})}catch(_){}}toast(msgs[k]);if(k==='forgot')e.preventDefault();return}}
 const g=t('[data-go]');if(g){if(g.dataset.go==='club')S.clubTab=S.clubTab;S.id=+g.dataset.id;S.l=g.dataset.l||'EV';S.menu=false;return go(g.dataset.go)}
 const lk=t('a[href^="#"][data-id]');if(lk){S.id=+lk.dataset.id}
 if(S.menu&&!t('.menu')){S.menu=false;render(true)}
 if(!t('.side')&&!t('.hamb'))document.body.classList.remove('nav-open');
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[data-go]'))e.target.click()});
render();
</script>

</body></html>
