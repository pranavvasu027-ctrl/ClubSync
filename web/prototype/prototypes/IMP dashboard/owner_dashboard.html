<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClubSync &mdash; Owner Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   CLUBSYNC DESIGN TOKENS
============================================================ */
:root {
  --bg:           #0A0A0F;
  --panel:        #111118;
  --panel-raised: #16161F;
  --panel-hover:  #1C1C28;
  --line:         rgba(255,255,255,0.08);
  --line-soft:    rgba(255,255,255,0.05);
  --line-strong:  rgba(255,255,255,0.14);
  --text:         #F1F5F9;
  --text-dim:     #94A3B8;
  --text-faint:   rgba(255,255,255,0.32);
  --accent:       #7C3AED;
  --accent-end:   #3B82F6;
  --accent-grad:  linear-gradient(135deg,#7C3AED,#3B82F6);
  --accent-dim:   rgba(124,58,237,0.18);
  --accent-glow:  rgba(124,58,237,0.28);
  --owner:        #818CF8;
  --owner-bg:     rgba(129,140,248,0.12);
  --owner-border: rgba(129,140,248,0.28);
  --green:        #22C55E;
  --green-bg:     rgba(34,197,94,0.10);
  --amber:        #F59E0B;
  --amber-bg:     rgba(245,158,11,0.10);
  --red:          #EF4444;
  --red-bg:       rgba(239,68,68,0.10);
  --blue:         #3B82F6;
  --blue-bg:      rgba(59,130,246,0.10);
  --purple:       #A78BFA;
  --purple-bg:    rgba(167,139,250,0.10);
  --mono: 'IBM Plex Mono',monospace;
  --sans: 'Inter',sans-serif;
  --radius: 4px;
  --radius-lg: 8px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13.5px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden;}
::selection{background:rgba(124,58,237,.35);color:#fff;}
::-webkit-scrollbar{width:7px;height:7px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:4px;}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.18);}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

#app{display:grid;grid-template-rows:auto auto 1fr;height:100vh;}

/* Impersonation banner */
#imp-banner{
  display:none;align-items:center;gap:10px;
  background:repeating-linear-gradient(135deg,#2D1A00,#2D1A00 12px,#231400 12px,#231400 24px);
  border-bottom:1px solid rgba(245,158,11,0.35);
  color:#FCD34D;padding:8px 20px;font-size:12px;font-family:var(--mono);z-index:30;
}
#imp-banner.active{display:flex;}
#imp-banner .imp-dot{width:7px;height:7px;border-radius:50%;background:#FCD34D;animation:blink 1.4s infinite;flex-shrink:0;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
#imp-banner .imp-timer{margin-left:auto;display:flex;align-items:center;gap:16px;}
#imp-banner .exit-btn{background:#FCD34D;color:#1C1200;border:none;padding:5px 13px;font-weight:700;font-size:11.5px;border-radius:3px;}
#imp-banner .exit-btn:hover{background:#FDE68A;}

/* Topbar */
#topbar{display:flex;align-items:center;height:52px;border-bottom:1px solid var(--line);padding:0 20px;background:rgba(10,10,15,0.92);backdrop-filter:blur(12px);z-index:20;gap:0;}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:14px;letter-spacing:-.02em;padding-right:20px;margin-right:20px;border-right:1px solid var(--line);height:100%;}
.brand-mark{width:22px;height:22px;border-radius:5px;background:var(--accent-grad);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;font-weight:700;color:#fff;box-shadow:0 0 14px var(--accent-glow);}
.brand-tag{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.06em;background:var(--owner-bg);color:var(--owner);border:1px solid var(--owner-border);padding:2px 6px;border-radius:3px;margin-left:2px;}
.pulse-strip{display:flex;align-items:center;gap:24px;flex:1;overflow:hidden;font-family:var(--mono);font-size:11px;color:var(--text-dim);}
.pulse-item{display:flex;align-items:center;gap:6px;white-space:nowrap;}
.pulse-item .dot{width:6px;height:6px;border-radius:50%;}
.pulse-item b{color:var(--text);font-weight:600;}
.right-cluster{display:flex;align-items:center;gap:12px;margin-left:auto;}
.tb-search{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:6px 11px;width:230px;color:var(--text-faint);font-size:12px;cursor:text;}
.tb-search kbd{margin-left:auto;font-family:var(--mono);font-size:9px;background:var(--panel-raised);border:1px solid var(--line);border-radius:3px;padding:1px 5px;color:var(--text-faint);}
.icon-btn{width:32px;height:32px;border-radius:5px;border:1px solid transparent;display:flex;align-items:center;justify-content:center;background:transparent;color:var(--text-dim);position:relative;}
.icon-btn:hover{background:var(--panel);border-color:var(--line);}
.icon-btn .badge{position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--red);border:1.5px solid var(--bg);}
.owner-chip{display:flex;align-items:center;gap:8px;padding:5px 11px 5px 5px;border:1px solid var(--owner-border);border-radius:20px;background:var(--owner-bg);cursor:pointer;}
.owner-chip:hover{border-color:var(--owner);}
.owner-av{width:24px;height:24px;border-radius:50%;background:var(--accent-grad);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;}
.owner-role{font-family:var(--mono);font-size:9px;color:var(--owner);letter-spacing:.04em;}

/* Body grid */
#body-grid{display:grid;grid-template-columns:228px 1fr;min-height:0;}

/* Rail */
#rail{border-right:1px solid var(--line);background:var(--bg);overflow-y:auto;padding:12px 10px 24px;display:flex;flex-direction:column;gap:1px;}
.rail-group-label{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-faint);padding:16px 10px 5px;}
.rail-group-label:first-child{padding-top:4px;}
.rail-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;color:var(--text-dim);font-size:12.5px;font-weight:500;cursor:pointer;border:1px solid transparent;position:relative;transition:all .12s;}
.rail-item:hover{background:var(--panel);color:var(--text);}
.rail-item.active{background:var(--panel-raised);color:var(--text);border-color:var(--line-strong);}
.rail-item.active::before{content:'';position:absolute;left:-10px;top:9px;bottom:9px;width:2.5px;background:var(--accent-grad);border-radius:2px;}
.rail-item .ic{width:15px;height:15px;flex-shrink:0;opacity:.8;}
.rail-item.active .ic{opacity:1;}
.count-chip{margin-left:auto;font-family:var(--mono);font-size:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1px 6px;color:var(--text-faint);}
.count-chip.warn{color:var(--amber);border-color:rgba(245,158,11,.3);}
.count-chip.crit{color:var(--red);border-color:rgba(239,68,68,.3);background:var(--red-bg);}

/* Main */
#main{overflow-y:auto;padding:28px 34px 80px;min-width:0;}
.view-header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:24px;gap:20px;}
.view-header h1{font-size:21px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px;}
.view-header .sub{color:var(--text-dim);font-size:12.5px;}
.view-header .actions{display:flex;gap:8px;flex-shrink:0;}

/* Buttons */
.btn{font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:6px;border:1px solid var(--line-strong);background:var(--panel);color:var(--text);display:inline-flex;align-items:center;gap:6px;transition:all .12s;white-space:nowrap;}
.btn:hover{background:var(--panel-raised);border-color:rgba(255,255,255,.18);}
.btn.primary{background:var(--accent-grad);border-color:transparent;color:#fff;box-shadow:0 0 16px var(--accent-glow);}
.btn.primary:hover{filter:brightness(1.1);}
.btn.danger{background:var(--red-bg);border-color:rgba(239,68,68,.3);color:#FCA5A5;}
.btn.danger:hover{background:rgba(239,68,68,.18);}
.btn.sm{padding:5px 10px;font-size:11.5px;border-radius:4px;}
.btn:disabled{opacity:.38;cursor:not-allowed;}

/* Panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);padding:18px 20px;}
.panel+.panel{margin-top:14px;}
.panel-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text-dim);margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:10px;}

/* Stat grid */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);padding:18px 20px;transition:border-color .15s;}
.stat:hover{border-color:var(--line-strong);}
.stat .label{font-size:11.5px;color:var(--text-dim);margin-bottom:10px;display:flex;align-items:center;gap:7px;}
.stat .value{font-family:var(--mono);font-size:28px;font-weight:600;letter-spacing:-.03em;line-height:1;}
.stat .delta{font-family:var(--mono);font-size:10.5px;margin-top:8px;color:var(--text-faint);}
.stat .delta.up{color:var(--green);}
.stat .delta.down{color:var(--red);}
.progress-track{height:5px;background:var(--panel-raised);border-radius:4px;overflow:hidden;margin:10px 0 6px;}
.progress-fill{height:100%;border-radius:4px;transition:width .4s;}

/* Table */
table{width:100%;border-collapse:collapse;font-size:12.5px;}
thead th{text-align:left;font-weight:600;color:var(--text-faint);font-size:10px;text-transform:uppercase;letter-spacing:.07em;padding:0 10px 10px;border-bottom:1px solid var(--line);}
tbody td{padding:11px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr{transition:background .1s;}
tbody tr:hover{background:var(--panel-hover);}
.mono{font-family:var(--mono);}
.dim{color:var(--text-dim);}
.faint{color:var(--text-faint);}
.fw{font-weight:600;}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:20px;font-family:var(--mono);white-space:nowrap;}
.pill .d{width:5px;height:5px;border-radius:50%;flex-shrink:0;}
.pill.ok{color:var(--green);background:var(--green-bg);}
.pill.ok .d{background:var(--green);}
.pill.warn{color:var(--amber);background:var(--amber-bg);}
.pill.warn .d{background:var(--amber);}
.pill.crit{color:var(--red);background:var(--red-bg);}
.pill.crit .d{background:var(--red);}
.pill.off{color:var(--text-faint);background:rgba(255,255,255,.05);}
.pill.off .d{background:var(--text-faint);}
.pill.blue{color:var(--blue);background:var(--blue-bg);}
.pill.blue .d{background:var(--blue);}
.pill.purple{color:var(--purple);background:var(--purple-bg);}
.pill.purple .d{background:var(--purple);}

/* Toggle */
.switch{width:36px;height:20px;border-radius:12px;background:rgba(255,255,255,.1);border:1px solid var(--line);position:relative;flex-shrink:0;cursor:pointer;transition:all .15s;}
.switch::after{content:'';position:absolute;width:14px;height:14px;border-radius:50%;background:var(--text-faint);top:2px;left:2px;transition:all .15s;}
.switch.on{background:var(--accent);border-color:var(--accent);}
.switch.on::after{left:18px;background:#fff;}

/* Modal */
.modal-veil{display:none;position:fixed;inset:0;background:rgba(5,5,8,.75);backdrop-filter:blur(4px);align-items:center;justify-content:center;z-index:100;}
.modal-veil.active{display:flex;}
.modal{background:var(--panel-raised);border:1px solid var(--line-strong);border-radius:10px;width:480px;max-width:92vw;padding:24px 24px 18px;box-shadow:0 24px 80px rgba(0,0,0,.65);}
.modal h3{font-size:15px;font-weight:700;margin-bottom:5px;}
.modal p.desc{color:var(--text-dim);font-size:12px;margin-bottom:18px;line-height:1.6;}
.modal .field{margin-bottom:12px;}
.modal .field label{display:block;font-size:11px;color:var(--text-dim);font-weight:600;letter-spacing:.03em;text-transform:uppercase;margin-bottom:5px;}
.modal .field input,.modal .field select,.modal .field textarea{width:100%;background:var(--bg);border:1px solid var(--line-strong);border-radius:5px;padding:8px 11px;color:var(--text);font-size:12.5px;}
.modal .field input:focus,.modal .field select:focus,.modal .field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,58,237,.18);}
.modal .field textarea{resize:vertical;min-height:72px;}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line);}
.warn-box{background:rgba(245,158,11,.07);border:1px solid rgba(245,158,11,.28);border-radius:5px;padding:10px 14px;font-size:11.5px;color:#FCD34D;display:flex;gap:9px;align-items:flex-start;}
.info-box{background:rgba(59,130,246,.07);border:1px solid rgba(59,130,246,.24);border-radius:6px;padding:12px 16px;font-size:12px;display:flex;gap:9px;align-items:flex-start;margin-bottom:14px;}
.info-box b{color:var(--blue);}
.upload-zone{border:1.5px dashed var(--line-strong);border-radius:8px;padding:36px;text-align:center;color:var(--text-dim);transition:all .15s;cursor:pointer;}
.upload-zone:hover{border-color:var(--accent);background:rgba(124,58,237,.04);}
.mini-bar-track{width:80px;height:4px;background:var(--panel-raised);border-radius:3px;overflow:hidden;}
.mini-bar-fill{height:100%;border-radius:3px;}
.hier-card{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--panel);border:1px solid var(--line);border-radius:6px;max-width:520px;transition:border-color .12s;}
.hier-card:hover{border-color:var(--line-strong);}
.hier-card.root{background:var(--panel-raised);border-color:var(--owner-border);}
.hier-children{margin-left:22px;margin-top:8px;display:flex;flex-direction:column;gap:8px;position:relative;}
.hier-children::before{content:'';position:absolute;left:-14px;top:0;bottom:16px;width:1px;background:var(--line-strong);}
.grad-text{background:var(--accent-grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.mod-item{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line-soft);}
.mod-item:last-child{border-bottom:none;}
.empty-note{color:var(--text-faint);font-size:12px;padding:20px 0;text-align:center;}
svg.ic{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
</style>
</head>
<body>
<div id="app">
  <div id="imp-banner">
    <span class="imp-dot"></span>
    <span>VIEWING AS &nbsp;<b id="imp-role-label">FACULTY &middot; Dr. R. Menon, GEC Trivandrum</b>&nbsp; &mdash; all actions are logged</span>
    <div class="imp-timer">
      <span>auto-exit in <b id="imp-countdown">05:00</b></span>
      <button class="exit-btn" id="imp-exit-btn">&times; Exit impersonation</button>
    </div>
  </div>
  <div id="topbar"></div>
  <div id="body-grid">
    <div id="rail"></div>
    <div id="main"></div>
  </div>
</div>
<div class="modal-veil" id="modal-veil">
  <div class="modal" id="modal-body"></div>
</div>

function renderRail(){
  const counts=getCounts();
  document.getElementById('rail').innerHTML=NAV.map(g=>`
    <div class="rail-group-label">${g.group}</div>
    ${g.items.map(it=>{
      const c=it.countKey?counts[it.countKey]:null;
      const cls=(it.countKey==='critSvc'||it.countKey==='modCrit')?'crit':(it.countKey&&c?'warn':'');
      return`<div class="rail-item ${currentView===it.id?'active':''}" data-view="${it.id}">${IC[it.icon]}<span>${it.label}</span>${c?`<span class="count-chip ${cls}">${c}</span>`:''}</div>`;
    }).join('')}`).join('');
  document.getElementById('rail').querySelectorAll('.rail-item').forEach(n=>n.addEventListener('click',()=>navigate(n.dataset.view)));
}

function navigate(view){currentView=view;renderRail();renderMain();document.getElementById('main').scrollTop=0;}

function pill(cls,label){return`<span class="pill ${cls}"><span class="d"></span>${label}</span>`;}
function statusPill(s){const m={ok:'Healthy',warn:'Degraded',crit:'Critical',off:'Free',blue:'Open',purple:'Info'};return pill(s,m[s]||s);}
function tierPill(t){return t==='Premium'?pill('blue','Premium'):pill('off','Free');}
function msPill(s){if(s==='active')return pill('ok','Active');if(s==='suspended')return pill('crit','Suspended');return pill('warn','On leave');}
function hierColor(c){return{owner:'#818CF8',blue:'#3B82F6',amber:'#F59E0B',green:'#22C55E'}[c]||'rgba(255,255,255,0.25)';}

function renderHierNode(node,depth){
  const kids=node.children||[];
  return`<div>
    <div class="hier-card ${depth===0?'root':''}" ${depth===0?'style="border-color:var(--owner-border)"':''}>
      ${depth>0?`<span class="faint" style="font-size:11px;font-family:var(--mono)">&boxdr;</span>`:''}
      <span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${hierColor(node.color)};flex-shrink:0;box-shadow:0 0 6px ${hierColor(node.color)}55;"></span>
      <div style="flex:1;min-width:0;"><div class="fw" style="font-size:12.5px;">${node.name}</div>${node.sub?`<div class="dim" style="font-size:11px;">${node.sub}</div>`:''}</div>
      <span class="mono faint" style="font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;">${node.role}</span>
    </div>
    ${kids.length?`<div class="hier-children">${kids.map(k=>renderHierNode(k,depth+1)).join('')}</div>`:''}
  </div>`;
}

security:()=>`
  <div class="view-header">

delegation:()=>`
  <div class="view-header">
    <div><h1>Delegated Approval Windows</h1><div class="sub">Any role can nominate a temporary backup approver — audit trail always shows who actually signed off</div></div>
    <div class="actions"><button class="btn primary" id="btn-new-delegation">${IC.plus} New delegation</button></div>

    <table><thead><tr><th>From</th><th>Delegated to</th><th>Scope</th><th>Window</th><th>Status</th><th></th></tr></thead>

};

function renderMain(){
  document.getElementById('main').innerHTML=(VIEWS[currentView]||VIEWS.overview)();
  wireView();
}

function wireView(){
  document.querySelectorAll('[data-toggle]').forEach(sw=>sw.addEventListener('click',()=>sw.classList.toggle('on')));
  document.querySelectorAll('[data-flag]').forEach(sw=>sw.addEventListener('click',()=>{const i=parseInt(sw.dataset.flag);DATA.featureFlags[i].on=!DATA.featureFlags[i].on;}));
  document.querySelectorAll('[data-nav]').forEach(btn=>btn.addEventListener('click',()=>navigate(btn.dataset.nav)));
  const wire=(id,fn)=>{const el=document.getElementById(id);if(el)el.addEventListener('click',()=>openModal(fn()));};
  wire('btn-add-college',mAddCollege);
  wire('btn-add-college-ov',mAddCollege);
  wire('btn-remove-college',mRemoveCollege);
  wire('btn-add-member',mAddMember);
  wire('btn-assign-faculty',mAssignFaculty);
  wire('btn-new-override',mNewOverride);
  wire('btn-suspend-account',mSuspend);
  wire('btn-new-delegation',mNewDelegation);
  wire('btn-flag-override',mFlagOverride);
  const impBtn=document.getElementById('btn-start-imp');
  if(impBtn)impBtn.addEventListener('click',()=>{const col=document.getElementById('imp-college').value,rol=document.getElementById('imp-role').value,secs=parseInt(document.getElementById('imp-length').value);startImp(rol,col,secs);});
}

let impTimer=null,impSecsLeft=0;
function startImp(role,college,secs){
  const banner=document.getElementById('imp-banner'),label=document.getElementById('imp-role-label'),cd=document.getElementById('imp-countdown');
  label.textContent=`${role.toUpperCase()} \u00B7 ${college}`;impSecsLeft=secs;banner.classList.add('active');tick(cd);
  clearInterval(impTimer);impTimer=setInterval(()=>{impSecsLeft--;tick(cd);if(impSecsLeft<=0)exitImp();},1000);
}
function tick(el){const m=String(Math.floor(impSecsLeft/60)).padStart(2,'0'),s=String(impSecsLeft%60).padStart(2,'0');el.textContent=`${m}:${s}`;}
function exitImp(){clearInterval(impTimer);document.getElementById('imp-banner').classList.remove('active');}
document.getElementById('imp-exit-btn').addEventListener('click',exitImp);

renderTopbar();renderRail();renderMain();
</script>
</body>
</html>
